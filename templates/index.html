<!-- index.html — Kronos single page app -->
<!-- Phase 2 — do not edit until Phase 1 backend is complete -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kronos — CPU Scheduler</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="header glass">
    <span class="logo">KRONOS</span>
    <span class="subtitle">CPU Scheduling Simulator</span>
  </div>

  <div class="main-grid">
    <div class="input-panel glass">
      <label>Processes</label>
      <table id="process-table">
        <thead>
          <tr>
            <th>PID</th>
            <th>Arrival</th>
            <th>Burst</th>
            <th>Priority</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <button id="add-btn">+ Add Process</button>

      <label>Algorithm</label>
      <select id="algo-select">
        <option value="fcfs">FCFS</option>
        <option value="sjf">SJF — Non-preemptive</option>
        <option value="priority">Priority — Non-preemptive</option>
        <option value="rr">Round Robin</option>
      </select>

      <div id="quantum-row" style="display:none">
        <label>Time Quantum</label>
        <input type="number" id="quantum-input" value="2" min="1">
      </div>

      <button id="run-btn">Run Simulation</button>
      <div id="input-error"></div>
    </div>

    <div class="right-col">
      <div class="result-panel glass">
        <label>Gantt Chart</label>
        <div id="gantt-container">
          <p class="empty-state">Run a simulation to see results</p>
        </div>
      </div>

      <div class="result-panel glass">
        <label>Metrics</label>
        <div id="metrics-container">
          <p class="empty-state">Run a simulation to see results</p>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/js/main.js"></script>
</body>
</html>
